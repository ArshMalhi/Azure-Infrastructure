name: terraform-continuous-integration

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.hcl'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.tf'
      - '**.hcl'
      - '.github/workflows/**'
    workflow_dispatch:
    concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: "^1.9.0" # any 1.x from 1.9 up, matching required_version
  TF_IN_AUTOMATION: "true" # tells Terraform it's in CI (less chatty output)

jobs:
  # Formatting is checked once, from the repo root, so every folder
  # (bootstrap, landing-zone AND modules) is covered.
  fmt:
    name: Step 1: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

  # Validation runs once per stack (each folder with its own state).
  validate:
    name: validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # if one stack fails, still show the result of the other
      matrix:
        stack: [bootstrap, landing-zone]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -backend=false: CI only checks the code, it never touches real state
      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

   lint:
    name: Lint
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v4
 
      # -f compact turns problems into inline annotations on the PR diff
      - name: tflint
        run: terraform lint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" -f compact
    
    summary:
    name: Summary
    needs: [fmt, validate, lint, security]
    if: always() # run even when other jobs failed: that's when it's most useful
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write summary
        run: |
          {
            echo "## 🏰 Citadel CI"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Format | ${{ needs.fmt.result }} |"
            echo "| Validate | ${{ needs.validate.result }} |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Security scan | ${{ needs.security.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
 